spring.application.name=product-service

# Configure database based off of environment variables - default to H2 configuration.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update



#This is the variable that will tell us the proper location of the category service depending on the environment
category.service.url = ${CATEGORY_SERVICE_URL:http://localhost:8081}


#H2 Driver - leaving this blank to let spring determine driver based off of the url
# spring.datasource.driverClassName=org.h2.Driver

# Enable the H2 web console
spring.h2.console.enabled=true